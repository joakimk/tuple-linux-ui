[package]
name = "tuple-ui"
version = "2.0.0"
edition = "2021"
description = "Linux desktop client for Tuple pair programming, built on the unified tuple CLI"
license = "MIT"

[[bin]]
name = "tuple-ui"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
glib = "0.22"
gio = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "net", "time", "macros", "sync"] }
async-channel = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ksni = "0.3"
notify-rust = "4"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
ureq = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
